services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    # Name the built image so Docker reuses the cached layers across rebuilds.
    image: pnut-term-ts-dev:local
    ports:
      - "5003:5002"
      - "9124:8123"
    volumes:
      - ..:/workspaces/PNut-Term-TS:cached
      - todo-mcp-data:/home/node/.local/share/todo-mcp
    command: sleep infinity

volumes:
  todo-mcp-data:
