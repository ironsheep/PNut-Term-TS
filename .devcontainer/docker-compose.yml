services:
  dev:
    image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
    ports:
      - "5003:5002"
      - "9124:8123"
    volumes:
      - ..:/workspaces/PNut-Term-TS:cached
      - todo-mcp-data:/home/node/.local/share/todo-mcp
    command: sleep infinity

volumes:
  todo-mcp-data:
