# Pinned to the project name the Dev Containers extension already derived, so
# existing named volumes keep their data.
name: pnut-term-ts_devcontainer

services:
  dev:
    # Built by devcontainer.json's initializeCommand, not by a `build:` section
    # here (the reason is with that command).
    image: pnut-term-ts-dev:local
    ports:
      - "5003:5002"
      - "9124:8123"
    volumes:
      - ..:/workspaces/PNut-Term-TS:cached
    command: sleep infinity
