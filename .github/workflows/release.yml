name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip release creation)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  # Run JS actions on Node 24 now (becomes the runner default 2026-06-16),
  # clearing the Node 20 deprecation warnings — incl. actions/cache, which has
  # no Node 24 major yet. See github.blog deprecation-of-node-20 changelog.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Runs FIRST and gates every build. v1.0.3 shipped with F1 Help that contradicted the
  # app because the doc pass landed after the tag, and USER-GUIDE/QUICK-START were found
  # three releases stale at "Version 1.0.0". Neither announced itself — a release with
  # wrong content succeeds exactly as loudly as a correct one. This makes the mismatch
  # FAIL the release instead of shipping it. Content-drift findings stay advisory inside
  # the script; only mechanical facts are fatal (version stamps, the changelog heading,
  # and the workflow's own changelog parse, whose two failure modes are both silent).
  consistency:
    name: Release consistency gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check version stamps, changelog, and shipped docs
        shell: bash
        run: |
          chmod +x scripts/check-release-consistency.sh
          scripts/check-release-consistency.sh "${GITHUB_REF_NAME}"

  # Build Windows packages
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: consistency
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Get version from package.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

          # Convert to packed format (0.9.6 -> 000906)
          PACKED_VERSION=$(echo "$VERSION" | awk -F. '{printf "%02d%02d%02d", $1, $2, $3}')
          echo "PACKED_VERSION=${PACKED_VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: ${VERSION}, Packed: ${PACKED_VERSION}"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          # Electron's postinstall downloads its binary and can hit transient
          # 5xx / Gateway Timeouts from the CDN — retry a few times before failing.
          for attempt in 1 2 3; do
            echo "npm ci (attempt ${attempt}/3)"
            if npm ci; then exit 0; fi
            echo "npm ci failed — retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Cross-install Windows-arm64 koffi binary
        shell: bash
        run: |
          # koffi ships its native binary as a per-arch package (@koromix/koffi-win32-<arch>).
          # npm ci on this x64 runner installs only win32-x64, so the arm64 package must be
          # fetched explicitly for the dual-arch Windows build. Non-blocking: the packaging
          # script warns and continues if it is absent (x64 is the primary target).
          KOFFI_VER=$(node -p "require('./node_modules/@koromix/koffi-win32-x64/package.json').version" 2>/dev/null || echo "")
          if [ -n "$KOFFI_VER" ]; then
            echo "Cross-installing @koromix/koffi-win32-arm64@${KOFFI_VER}"
            npm install --no-save --force --os=win32 --cpu=arm64 "@koromix/koffi-win32-arm64@${KOFFI_VER}" || \
              echo "⚠️  arm64 koffi cross-install FAILED — the win32-arm64 build will have no working P2 download"
          else
            echo "⚠️  koffi-win32-x64 not found — skipping arm64 cross-install"
          fi

      - name: Build and package Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run packageWin

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: release/windows-package/*.zip
          if-no-files-found: error
          retention-days: 5

  # Build Linux packages
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: consistency
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

          # Convert to packed format (0.9.6 -> 000906)
          PACKED_VERSION=$(echo "$VERSION" | awk -F. '{printf "%02d%02d%02d", $1, $2, $3}')
          echo "PACKED_VERSION=${PACKED_VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: ${VERSION}, Packed: ${PACKED_VERSION}"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          # Electron's postinstall downloads its binary and can hit transient
          # 5xx / Gateway Timeouts from the CDN — retry a few times before failing.
          for attempt in 1 2 3; do
            echo "npm ci (attempt ${attempt}/3)"
            if npm ci; then exit 0; fi
            echo "npm ci failed — retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Build and package Linux
        run: npm run packageLinux

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: release/linux-package/*.zip
          retention-days: 5

  # Build macOS packages (unsigned)
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: consistency
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

          # Convert to packed format (0.9.6 -> 000906)
          PACKED_VERSION=$(echo "$VERSION" | awk -F. '{printf "%02d%02d%02d", $1, $2, $3}')
          echo "PACKED_VERSION=${PACKED_VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: ${VERSION}, Packed: ${PACKED_VERSION}"

      - name: Install Python and setuptools/distutils
        run: |
          brew install python-setuptools || true

      - name: Install Python dependencies
        run: |
          python3 -m pip install Pillow --break-system-packages

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          # Electron's postinstall downloads its binary and can hit transient
          # 5xx / Gateway Timeouts from the CDN — retry a few times before failing.
          for attempt in 1 2 3; do
            echo "npm ci (attempt ${attempt}/3)"
            if npm ci; then exit 0; fi
            echo "npm ci failed — retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          # Skip if no certificate configured
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing certificate configured, skipping signing"
            echo "SIGNING_ENABLED=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "SIGNING_ENABLED=true" >> $GITHUB_ENV

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          echo "Certificate imported successfully"

      - name: Build and package macOS (with signing if available)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run packageMac

      - name: List built packages
        run: |
          echo "macOS packages built:"
          ls -la release/macos-package/*.tar.gz 2>/dev/null || echo "No tar.gz files"
          ls -la release/macos-package/*.dmg 2>/dev/null || echo "No DMG files yet"

      # Upload tar.gz archives (NOT directories) to preserve symlinks
      # GitHub Actions artifacts do not preserve symlinks in directories
      - name: Upload macOS x64 package archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-pkg
          path: release/macos-package/pnut-term-ts-macos-x64-*.tar.gz
          retention-days: 1

      - name: Upload macOS arm64 package archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-pkg
          path: release/macos-package/pnut-term-ts-macos-arm64-*.tar.gz
          retention-days: 1

      - name: Upload version info
        uses: actions/upload-artifact@v4
        with:
          name: version-info
          path: package.json
          retention-days: 1

  # Sign macOS apps and create DMGs
  macos-sign:
    name: Sign & Package macOS DMGs
    runs-on: macos-latest
    needs: build-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download macOS x64 package archive
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-pkg
          path: archives/

      - name: Download macOS arm64 package archive
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-pkg
          path: archives/

      - name: Download version info
        uses: actions/download-artifact@v4
        with:
          name: version-info
          path: .

      # Extract tar.gz archives to preserve symlinks (critical for macOS code signing)
      - name: Extract package archives
        run: |
          mkdir -p packages
          echo "Extracting archives to preserve symlinks..."
          for archive in archives/*.tar.gz; do
            echo "Extracting: $archive"
            tar -xzf "$archive" -C packages/
          done
          echo ""
          echo "Extracted packages:"
          ls -la packages/

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

          # Convert to packed format (0.9.6 -> 000906)
          PACKED_VERSION=$(echo "$VERSION" | awk -F. '{printf "%02d%02d%02d", $1, $2, $3}')
          echo "PACKED_VERSION=${PACKED_VERSION}" >> $GITHUB_OUTPUT
          echo "Semantic: ${VERSION}, Packed: ${PACKED_VERSION}"

      - name: Install Python dependencies
        run: |
          python3 -m pip install Pillow --break-system-packages

      - name: List downloaded packages
        run: |
          echo "Package directories:"
          ls -la packages/
          echo ""
          echo "Contents:"
          find packages -type f | head -50

      - name: Restore executable permissions
        run: |
          # tar extraction should preserve permissions, but ensure executables are set as fallback
          find packages -name "pnut-term-ts" -type f -exec chmod +x {} \;
          find packages -name "Electron" -type f -exec chmod +x {} \;
          find packages -name "chrome_crashpad_handler" -type f -exec chmod +x {} \;
          echo "Executable permissions verified"

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          # Skip if no certificate configured
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing certificate configured, skipping signing"
            echo "SIGNING_ENABLED=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "SIGNING_ENABLED=true" >> $GITHUB_ENV

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          echo "Certificate imported successfully"

      - name: Create entitlements.plist
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.device.serial</key>
              <true/>
              <key>com.apple.security.device.usb</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Sign macOS app bundles
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_NAME: ${{ secrets.APPLE_DEVELOPER_NAME }}
        run: |
          PACKED_VERSION="${{ steps.version.outputs.PACKED_VERSION }}"
          IDENTITY="Developer ID Application: ${APPLE_DEVELOPER_NAME} (${APPLE_TEAM_ID})"

          for arch in x64 arm64; do
            # Find the .app bundle
            APP_PATH=$(find packages -name "*.app" -path "*${arch}*" -type d 2>/dev/null | head -1)

            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "=============================================="
              echo "Signing ${arch} app bundle: $APP_PATH"
              echo "Using identity: $IDENTITY"
              echo ""
              echo "Strategy: STRIP existing signatures, then sign EVERYTHING in correct nested order"
              echo "=============================================="

              # Signing-failure ledger. Every `codesign --sign` below used to end in `|| true`, so a
              # failure printed a line into a 2000-line log and the job carried on and SHIPPED the
              # bundle unsigned-or-partly-signed. Under hardened runtime that produces an app whose
              # main binary is fine (it launches) but whose UtilityProcess helper or .node binding
              # will not load — i.e. the GUI comes up and the serial host silently dies. Exactly the
              # failure we could not see. The `|| true` is still REQUIRED for control flow, because
              # these run inside `find | while` SUBSHELLS where a bare failure cannot propagate — so
              # record it instead, and fail the job below once every step has had its say.
              # (Same lesson as the fatal define/verify checks in scripts/build-production.sh.)
              SIGN_FAILURES="${RUNNER_TEMP:-/tmp}/sign_failures_${arch}.txt"
              : > "$SIGN_FAILURES"

              # ===========================================
              # Step 0: Strip ALL existing signatures
              # CRITICAL: Electron comes pre-signed. Must remove all signatures first!
              # ===========================================
              echo ""
              echo "Step 0/10: Stripping ALL existing signatures..."

              # Remove all _CodeSignature directories
              echo "  Removing _CodeSignature directories..."
              sig_count=$(find "$APP_PATH" -name "_CodeSignature" -type d 2>/dev/null | wc -l)
              find "$APP_PATH" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
              echo "  Removed $sig_count _CodeSignature directories"

              # Strip main app bundle signature
              codesign --remove-signature "$APP_PATH" 2>/dev/null || true

              # Strip main executable
              [ -f "$APP_PATH/Contents/MacOS/Electron" ] && codesign --remove-signature "$APP_PATH/Contents/MacOS/Electron" 2>/dev/null || true

              # Strip all helper apps
              find "$APP_PATH/Contents/Frameworks" -name "*.app" -type d -maxdepth 1 2>/dev/null | while read -r helper_app; do
                codesign --remove-signature "$helper_app" 2>/dev/null || true
                app_name=$(basename "$helper_app" .app)
                [ -f "$helper_app/Contents/MacOS/$app_name" ] && codesign --remove-signature "$helper_app/Contents/MacOS/$app_name" 2>/dev/null || true
              done

              # Strip all frameworks
              for framework in "$APP_PATH/Contents/Frameworks"/*.framework; do
                if [ -d "$framework" ]; then
                  framework_name=$(basename "$framework" .framework)
                  [ -f "$framework/Versions/A/$framework_name" ] && codesign --remove-signature "$framework/Versions/A/$framework_name" 2>/dev/null || true
                  codesign --remove-signature "$framework" 2>/dev/null || true
                fi
              done

              # Strip Electron Framework helpers
              find "$APP_PATH/Contents/Frameworks/Electron Framework.framework" -type f -perm +111 \
                -not -name "Electron Framework" -not -name "*.dylib" 2>/dev/null | while read -r helper; do
                codesign --remove-signature "$helper" 2>/dev/null || true
              done

              # Strip all dylibs
              find "$APP_PATH/Contents/Frameworks/Electron Framework.framework" -name "*.dylib" -type f 2>/dev/null | while read -r dylib; do
                codesign --remove-signature "$dylib" 2>/dev/null || true
              done

              # Strip native modules
              find "$APP_PATH" -name "*.node" -type f 2>/dev/null | while read -r node_file; do
                codesign --remove-signature "$node_file" 2>/dev/null || true
              done

              # Strip ShipIt executables
              find "$APP_PATH/Contents/Frameworks/Squirrel.framework" -name "ShipIt" -type f 2>/dev/null | while read -r shipit; do
                codesign --remove-signature "$shipit" 2>/dev/null || true
              done

              echo "  ✓ All existing signatures removed"

              # ===========================================
              # Step 1: Sign all .dylib files (deepest level)
              # ===========================================
              echo ""
              echo "Step 1/10: Signing .dylib files..."
              find "$APP_PATH/Contents/Frameworks/Electron Framework.framework" -name "*.dylib" -type f 2>/dev/null | while read -r dylib; do
                echo "  Signing: $(basename "$dylib")"
                codesign --force --sign "$IDENTITY" --options runtime --timestamp "$dylib" 2>&1 || echo "dylib: $dylib" >> "$SIGN_FAILURES"
              done
              echo "  ✓ Libraries signed"

              # ===========================================
              # Step 2: Sign Electron Framework helpers (chrome_crashpad_handler, etc.)
              # ===========================================
              echo ""
              echo "Step 2/10: Signing Electron Framework helpers..."
              find "$APP_PATH/Contents/Frameworks/Electron Framework.framework" -type f -perm +111 \
                -not -name "Electron Framework" \
                -not -name "*.dylib" \
                -not -path "*/Versions/*/Resources/*" 2>/dev/null | while read -r helper; do
                echo "  Signing: $(basename "$helper")"
                codesign --force --sign "$IDENTITY" --options runtime --timestamp "$helper" 2>&1 || echo "framework-helper: $helper" >> "$SIGN_FAILURES"
              done
              echo "  ✓ Framework helpers signed"

              # ===========================================
              # Step 3: Sign Electron Framework binary
              # ===========================================
              echo ""
              echo "Step 3/10: Signing Electron Framework binary..."
              if [ -f "$APP_PATH/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework" ]; then
                codesign --force --sign "$IDENTITY" --options runtime --timestamp \
                  "$APP_PATH/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
                echo "  ✓ Electron Framework binary signed"
              fi

              # ===========================================
              # Step 4: Sign Electron Framework.framework bundle
              # NOTE: May fail with "bundle format is ambiguous" if symlinks are broken
              # This is non-fatal - the app bundle signature will seal everything
              # ===========================================
              echo ""
              echo "Step 4/10: Signing Electron Framework.framework bundle..."
              if [ -d "$APP_PATH/Contents/Frameworks/Electron Framework.framework" ]; then
                if codesign --force --sign "$IDENTITY" --options runtime --timestamp \
                  "$APP_PATH/Contents/Frameworks/Electron Framework.framework" 2>&1; then
                  echo "  ✓ Electron Framework.framework signed"
                else
                  echo "  ⚠️ Framework bundle signing failed (will be sealed by app signature)"
                fi
              fi

              # ===========================================
              # Step 5: Sign other frameworks (Mantle, ReactiveObjC, Squirrel)
              # CRITICAL: Sign ShipIt executables BEFORE signing Squirrel.framework
              # ===========================================
              echo ""
              echo "Step 5/10: Signing other frameworks..."

              # First, sign ShipIt executables inside Squirrel framework (before sealing)
              find "$APP_PATH/Contents/Frameworks/Squirrel.framework" -name "ShipIt" -type f 2>/dev/null | while read -r shipit; do
                echo "  Signing ShipIt: $(dirname "$shipit" | xargs basename)"
                codesign --force --sign "$IDENTITY" --options runtime --timestamp --entitlements entitlements.plist "$shipit" 2>&1 || echo "shipit: $shipit" >> "$SIGN_FAILURES"
              done

              # Now sign all frameworks (binary first, then bundle)
              for framework in "$APP_PATH/Contents/Frameworks"/*.framework; do
                if [ -d "$framework" ] && [[ "$framework" != *"Electron Framework.framework" ]]; then
                  framework_name=$(basename "$framework" .framework)
                  echo "  Signing framework: $framework_name"

                  # First sign the binary inside the framework
                  if [ -f "$framework/Versions/A/$framework_name" ]; then
                    codesign --force --sign "$IDENTITY" --options runtime --timestamp \
                      "$framework/Versions/A/$framework_name" 2>&1 || true
                  fi

                  # Then sign the framework bundle itself
                  codesign --force --sign "$IDENTITY" --options runtime --timestamp "$framework" 2>&1 || echo "framework: $framework" >> "$SIGN_FAILURES"
                fi
              done
              echo "  ✓ Other frameworks signed"

              # ===========================================
              # Step 6: Sign helper .app bundles (GPU, Plugin, Renderer, Helper)
              # ===========================================
              echo ""
              echo "Step 6/10: Signing helper .app bundles..."
              find "$APP_PATH/Contents/Frameworks" -name "*.app" -type d -maxdepth 1 2>/dev/null | while read -r helper_app; do
                echo "  Signing: $(basename "$helper_app")"

                # Sign the executable inside first
                app_name=$(basename "$helper_app" .app)
                if [ -f "$helper_app/Contents/MacOS/$app_name" ]; then
                  codesign --force --sign "$IDENTITY" --options runtime --timestamp \
                    --entitlements entitlements.plist "$helper_app/Contents/MacOS/$app_name" 2>&1 \
                    || echo "helper-exec: $helper_app/Contents/MacOS/$app_name" >> "$SIGN_FAILURES"
                fi

                # Then sign the .app bundle
                codesign --force --sign "$IDENTITY" --options runtime --timestamp \
                  --entitlements entitlements.plist "$helper_app" 2>&1 \
                  || echo "helper-bundle: $helper_app" >> "$SIGN_FAILURES"
              done
              echo "  ✓ Helper apps signed"

              # ===========================================
              # Step 7: Sign native modules (.node files)
              # ===========================================
              echo ""
              echo "Step 7/10: Signing native modules..."
              find "$APP_PATH" -name "*.node" -type f 2>/dev/null | while read -r node_file; do
                echo "  Signing: $(basename "$node_file")"
                codesign --force --sign "$IDENTITY" --options runtime --timestamp "$node_file" 2>&1 || echo "native-module: $node_file" >> "$SIGN_FAILURES"
              done
              echo "  ✓ Native modules signed"

              # ===========================================
              # Step 8: Sign main Electron executable
              # ===========================================
              echo ""
              echo "Step 8/10: Signing main Electron executable..."
              if [ -f "$APP_PATH/Contents/MacOS/Electron" ]; then
                codesign --force --sign "$IDENTITY" --options runtime --timestamp \
                  --entitlements entitlements.plist "$APP_PATH/Contents/MacOS/Electron"
                echo "  ✓ Main executable signed"
              fi

              # ===========================================
              # Step 9: Sign the app bundle itself
              # ===========================================
              echo ""
              echo "Step 9/10: Signing app bundle..."
              codesign --force --sign "$IDENTITY" \
                --options runtime \
                --timestamp \
                --entitlements entitlements.plist \
                "$APP_PATH"
              echo "  ✓ App bundle signed"

              # ===========================================
              # Step 10: Verify signature
              # ===========================================
              echo ""
              echo "Step 10/10: Verifying signature..."
              # FATAL, not advisory. This used to print a ⚠ and continue, which is how a bundle
              # whose helper or native module failed to sign could reach a user: the app launches
              # (its own signature is valid) and only the UtilityProcess dies, silently.
              if codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1; then
                echo "  ✓ Signature verification passed!"
              else
                echo "  ❌ Signature verification FAILED for ${arch}: $APP_PATH"
                echo "     Refusing to package an app whose signature does not validate."
                exit 1
              fi

              # Now fail on anything the per-step ledger recorded. Reported here, after every step
              # has run, so one log shows EVERY signing failure instead of only the first.
              if [ -s "$SIGN_FAILURES" ]; then
                echo ""
                echo "  ❌ ${arch}: $(wc -l < "$SIGN_FAILURES" | tr -d ' ') codesign operation(s) FAILED:"
                sed 's/^/     - /' "$SIGN_FAILURES"
                echo "     A partly-signed bundle under hardened runtime launches but cannot load"
                echo "     its helper/native code. Refusing to package."
                exit 1
              fi

              echo ""
              echo "=============================================="
              echo "✓ ${arch} app signing complete!"
              echo "=============================================="
            else
              # Not a warning — the loop is over the arches we just built, so a missing bundle
              # means the build silently produced nothing to sign.
              echo "❌ App bundle not found for ${arch} — nothing to sign. Refusing to package."
              exit 1
            fi
          done

      - name: Create DMG background
        run: |
          cat > create_dmg_bg.py << 'PYTHON_SCRIPT'
          from PIL import Image, ImageDraw, ImageFont
          import os

          width, height = 500, 300
          img = Image.new('RGB', (width, height), color='white')
          draw = ImageDraw.Draw(img)

          try:
              font_title = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", 28)
              font_subtitle = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", 14)
              font_instruction = ImageFont.truetype("/System/Library/Fonts/Helvetica.ttc", 18)
          except:
              font_title = ImageFont.load_default()
              font_subtitle = font_title
              font_instruction = font_title

          title = "PNut-Term-TS"
          title_color = (128, 0, 0)
          bbox = draw.textbbox((0, 0), title, font=font_title)
          x = (width - (bbox[2] - bbox[0])) // 2
          draw.text((x, 25), title, fill=title_color, font=font_title)

          subtitle = "Debug Terminal for Parallax Propeller 2"
          bbox = draw.textbbox((0, 0), subtitle, font=font_subtitle)
          x = (width - (bbox[2] - bbox[0])) // 2
          draw.text((x, 58), subtitle, fill=(80, 80, 80), font=font_subtitle)

          arrow_y, arrow_left, arrow_right = 150, 200, 290
          arrow_color = (128, 0, 0)
          draw.rectangle([(arrow_left, arrow_y - 2), (arrow_right - 12, arrow_y + 2)], fill=arrow_color)
          draw.polygon([(arrow_right, arrow_y), (arrow_right - 12, arrow_y - 12), (arrow_right - 12, arrow_y + 12)], fill=arrow_color)

          instruction = "Drag to Applications Folder to Install"
          bbox = draw.textbbox((0, 0), instruction, font=font_instruction)
          x = (width - (bbox[2] - bbox[0])) // 2
          draw.text((x, 255), instruction, fill=(80, 80, 80), font=font_instruction)

          # DMG-surface company logo — keep this block IDENTICAL to PNut-TS/.github/workflows/release.yml
          logo_path = "assets/logo.png"
          if os.path.exists(logo_path):
              try:
                  logo = Image.open(logo_path).convert("RGBA")
                  logo_h = 85
                  scale = logo_h / logo.size[1]
                  logo = logo.resize((int(logo.size[0] * scale), logo_h), Image.LANCZOS)
                  # Full ISP logo, top-right; h=85 keeps the wordmark legible and clears the drag-icon band
                  x = width - logo.size[0] - 18
                  img.paste(logo, (x, 12), logo)
              except:
                  pass

          img.save('dmg-background.png')
          print("Created dmg-background.png (500x300)")
          PYTHON_SCRIPT
          python3 create_dmg_bg.py
          rm -f create_dmg_bg.py

      - name: Create DMGs
        run: |
          PACKED_VERSION="${{ steps.version.outputs.PACKED_VERSION }}"

          # Define AppleScript for DMG styling
          cat > /tmp/dmg-style.scpt << 'APPLESCRIPT'
          tell application "Finder"
            tell disk "PNut-Term-TS"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {400, 100, 900, 400}
              set theViewOptions to the icon view options of container window
              set arrangement of theViewOptions to not arranged
              set icon size of theViewOptions to 72
              set background picture of theViewOptions to file ".background:background.png"
              set position of item "PNut-Term-TS.app" of container window to {125, 150}
              set position of item "Applications" of container window to {375, 150}
              close
              open
              update without registering applications
              delay 2
              close
            end tell
          end tell
          APPLESCRIPT

          for arch in x64 arm64; do
            # Find the app bundle for this arch
            APP_PATH=$(find packages -name "*.app" -path "*${arch}*" -type d 2>/dev/null | head -1)
            DMG_NAME="pnut-term-ts-macos-${arch}-${PACKED_VERSION}.dmg"

            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "Creating DMG for ${arch} from $APP_PATH..."

              # Create staging directory
              STAGING="dmg-staging-${arch}"
              rm -rf "$STAGING"
              mkdir -p "$STAGING"

              # Copy app bundle using ditto (preserves xattrs, symlinks, and code signatures)
              # CRITICAL: cp -r strips extended attributes that codesign adds, invalidating signatures
              ditto "$APP_PATH" "$STAGING/$(basename "$APP_PATH")"

              # NOTE: App icon is already set during packaging (create-macos-packages.sh).
              # Do NOT copy it here — modifying the app bundle after signing invalidates the code signature.

              # Create Applications symlink
              ln -s /Applications "$STAGING/Applications"

              # Copy background if exists
              if [ -f "dmg-background.png" ]; then
                mkdir -p "$STAGING/.background"
                cp dmg-background.png "$STAGING/.background/background.png"
              fi

              # Copy volume icon if exists
              if [ -f "assets/volume-icon.icns" ]; then
                cp assets/volume-icon.icns "$STAGING/.VolumeIcon.icns"
              fi

              # Calculate DMG size (25% padding for HFS+ overhead, minimum 200MB)
              FOLDER_SIZE_KB=$(du -sk "$STAGING" | cut -f1)
              FOLDER_SIZE_MB=$((FOLDER_SIZE_KB / 1024))
              PADDING=$((FOLDER_SIZE_MB * 25 / 100))
              if [ $PADDING -lt 200 ]; then PADDING=200; fi
              DMG_SIZE=$((FOLDER_SIZE_MB + PADDING))

              # Create temporary read-write DMG with HFS+
              echo "Building DMG (${DMG_SIZE}MB)..."
              hdiutil create -volname "PNut-Term-TS" \
                -srcfolder "$STAGING" \
                -fs HFS+ \
                -ov -format UDRW \
                -size ${DMG_SIZE}m \
                "temp-$DMG_NAME"

              # Mount and customize
              MOUNT_OUTPUT=$(hdiutil attach -readwrite -noverify -noautoopen "temp-$DMG_NAME" 2>&1)
              DEVICE=$(echo "$MOUNT_OUTPUT" | egrep '^/dev/' | sed 1q | awk '{print $1}')
              sleep 2

              # Apply window styling with AppleScript
              echo "Applying window styling..."
              osascript /tmp/dmg-style.scpt || true

              sync
              sync
              sleep 1

              # Set volume icon AFTER AppleScript (AppleScript can delete the icon file)
              if [ -f "assets/volume-icon.icns" ]; then
                echo "Setting volume icon (after AppleScript)..."
                # Re-copy the icon in case AppleScript deleted it
                cp assets/volume-icon.icns "/Volumes/PNut-Term-TS/.VolumeIcon.icns"
                # Set icon file creator code
                SetFile -c icnC "/Volumes/PNut-Term-TS/.VolumeIcon.icns" 2>/dev/null || true
                # Set custom icon flag on volume
                SetFile -a C "/Volumes/PNut-Term-TS" 2>/dev/null || true
                echo "Volume icon set"
              fi

              sync
              sync
              sleep 1

              # Unmount with retry loop
              echo "Unmounting disk..."
              DETACH_ATTEMPTS=0
              MAX_DETACH_ATTEMPTS=5
              while [ $DETACH_ATTEMPTS -lt $MAX_DETACH_ATTEMPTS ]; do
                if hdiutil detach "${DEVICE}" 2>/dev/null; then
                  echo "Disk unmounted successfully"
                  break
                fi
                DETACH_ATTEMPTS=$((DETACH_ATTEMPTS + 1))
                echo "Unmount attempt $DETACH_ATTEMPTS failed, waiting..."
                sleep 3
              done

              if [ $DETACH_ATTEMPTS -eq $MAX_DETACH_ATTEMPTS ]; then
                echo "Force unmounting..."
                hdiutil detach "${DEVICE}" -force || true
                sleep 2
              fi

              sleep 3

              # Convert to compressed read-only
              echo "Compressing DMG..."
              hdiutil convert "temp-$DMG_NAME" -format UDZO -imagekey zlib-level=9 -o "$DMG_NAME"
              rm -f "temp-$DMG_NAME"

              echo "Created: $DMG_NAME"
              rm -rf "$STAGING"
            else
              echo "WARNING: App bundle not found for ${arch}"
            fi
          done

          rm -f /tmp/dmg-style.scpt

      - name: Sign DMGs
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_NAME: ${{ secrets.APPLE_DEVELOPER_NAME }}
        run: |
          for dmg in pnut-term-ts-macos-*.dmg; do
            if [ -f "$dmg" ]; then
              echo "Signing DMG: $dmg"
              codesign --force --sign "Developer ID Application: ${APPLE_DEVELOPER_NAME} (${APPLE_TEAM_ID})" \
                --options runtime \
                --timestamp \
                "$dmg"
              codesign --verify --verbose=2 "$dmg"
            fi
          done

      - name: Notarize DMGs
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for dmg in pnut-term-ts-macos-*.dmg; do
            if [ -f "$dmg" ]; then
              echo "Notarizing: $dmg"

              # Submit and capture output to get submission ID
              SUBMIT_OUTPUT=$(xcrun notarytool submit "$dmg" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --output-format json \
                --wait 2>&1) || true

              echo "Notarytool output:"
              echo "$SUBMIT_OUTPUT"

              # Extract submission ID and status from JSON
              SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
              STATUS=$(echo "$SUBMIT_OUTPUT" | grep -o '"status":"[^"]*"' | tail -1 | cut -d'"' -f4)

              echo "Submission ID: $SUBMISSION_ID"
              echo "Status: $STATUS"

              # If notarization failed, fetch and display the log
              if [ "$STATUS" != "Accepted" ]; then
                echo "::error::Notarization failed with status: $STATUS"
                echo ""
                echo "========== NOTARIZATION LOG =========="
                if [ -n "$SUBMISSION_ID" ]; then
                  xcrun notarytool log "$SUBMISSION_ID" \
                    --apple-id "$APPLE_ID" \
                    --password "$APPLE_ID_PASSWORD" \
                    --team-id "$APPLE_TEAM_ID" || echo "Failed to fetch log"
                else
                  echo "No submission ID available to fetch log"
                fi
                echo "======================================"
                exit 1
              fi

              echo "Stapling notarization ticket..."
              xcrun stapler staple "$dmg"

              echo "Validating..."
              xcrun stapler validate "$dmg"

              echo "$dmg notarized and stapled successfully"
            fi
          done

      - name: Create macOS ZIP packages (containing DMGs)
        run: |
          PACKED_VERSION="${{ steps.version.outputs.PACKED_VERSION }}"

          for arch in x64 arm64; do
            DMG_FILE="pnut-term-ts-macos-${arch}-${PACKED_VERSION}.dmg"
            ZIP_FILE="pnut-term-ts-macos-${arch}-${PACKED_VERSION}.zip"
            if [ -f "$DMG_FILE" ]; then
              echo "Creating ZIP containing DMG for macOS ${arch}..."
              zip "$ZIP_FILE" "$DMG_FILE"
              echo "Created: $ZIP_FILE (containing $DMG_FILE)"
            else
              echo "WARNING: DMG not found: $DMG_FILE"
            fi
          done

      - name: Upload macOS ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: pnut-term-ts-macos-*.zip
          retention-days: 5

  # Create GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, macos-sign]
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: packages-windows
          path: release/

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: packages-linux
          path: release/

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: packages-macos
          path: release/

      - name: Download version info
        uses: actions/download-artifact@v4
        with:
          name: version-info
          path: .

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

          # Convert to packed format
          PACKED_VERSION=$(echo "$VERSION" | awk -F. '{printf "%02d%02d%02d", $1, $2, $3}')
          echo "PACKED_VERSION=${PACKED_VERSION}" >> $GITHUB_OUTPUT

      - name: List release artifacts
        run: |
          echo "Release artifacts:"
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          echo ""
          echo "Checksums:"
          cat checksums.txt

      - name: Determine release type
        id: release_type
        run: |
          PKG_VERSION="${{ steps.version.outputs.VERSION }}"

          # Check if triggered by tag or workflow_dispatch
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            RELEASE_TAG="v${TAG_VERSION}"
          else
            # workflow_dispatch - use package.json version
            TAG_VERSION="$PKG_VERSION"
            RELEASE_TAG="v${PKG_VERSION}"
          fi

          echo "TAG_VERSION=${TAG_VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          # NOTE: the pre-release FLAG ON GITHUB IS MANAGED BY HAND, deliberately. Stephen marks
          # releases as pre-release in the UI so nobody downloads a build thinking it is released,
          # and clears the flag when it actually ships. So a published release showing
          # `prerelease: true` while this computes `false` is NOT a bug in this logic — do not
          # "fix" it. This output only covers the tag/package.json MISMATCH case (a test tag).
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=PNut-Term-TS v${TAG_VERSION} (Test Release)" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=PNut-Term-TS v${TAG_VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release body
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACKED_VERSION="${{ steps.version.outputs.PACKED_VERSION }}"
          TAG="${{ steps.release_type.outputs.RELEASE_TAG }}"

          # Extract changelog section for this version.
          # Accepts BOTH heading forms: the Keep a Changelog form used through 0.11.x
          # ("## [1.0.0] - 2026-07-27") and the voicing-guide form used from 1.0.0 on
          # ("## v1.0.0 (2026-07-27)"). Both are matched so re-running this workflow on an
          # older tag still finds its section. Changing the changelog heading without
          # changing this awk is silent: the body renders EMPTY and the release still
          # succeeds.
          CHANGELOG_CONTENT=$(awk -v v="${VERSION}" '
            $0 ~ ("^## \\[" v "\\]") || $0 ~ ("^## v" v "( |$|\\()") { flag=1; next }
            /^## / { flag=0 }
            flag' CHANGELOG.md | sed '/^$/N;/^\n$/d')

          # One-line summary. Prefer the THEME LINE — the single sentence the voicing guide
          # requires directly under every version heading — and fall back to the first
          # bullet only when there is no theme line. The initial-release entry is a
          # paragraph with no bullets at all, so bullet-scraping alone yields nothing there.
          SUMMARY_LINE=$(echo "${CHANGELOG_CONTENT}" | grep -m1 -v '^\s*$' | grep -v '^###' | sed 's/^- //' | sed 's/\*\*[^*]*\*\*: //')
          if [ -z "${SUMMARY_LINE}" ]; then
            SUMMARY_LINE=$(echo "${CHANGELOG_CONTENT}" | grep -m1 '^\- ' | sed 's/^- //' | sed 's/\*\*[^*]*\*\*: //')
          fi

          # Generate release body file
          cat > release_body.md << RELEASE_EOF
          ## PNut-Term-TS ${TAG}

          Cross-Platform Debug Terminal for Parallax Propeller 2

          **This release:** ${SUMMARY_LINE:-Bug fixes and improvements}

          ---

          ### What's New in This Release

          ${CHANGELOG_CONTENT}

          See [CHANGELOG.md](https://github.com/ironsheep/PNut-Term-TS/blob/main/CHANGELOG.md) for the release history.

          ---

          ### Downloads

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | **macOS** | Apple Silicon (M1 and later) | \`pnut-term-ts-macos-arm64-${PACKED_VERSION}.zip\` |
          | **macOS** | Intel x64 | \`pnut-term-ts-macos-x64-${PACKED_VERSION}.zip\` |
          | **Windows** | x64 | \`pnut-term-ts-windows-x64-${PACKED_VERSION}.zip\` |
          | **Windows** | ARM64 | \`pnut-term-ts-windows-arm64-${PACKED_VERSION}.zip\` |
          | **Linux** | x64 | \`pnut-term-ts-linux-x64-${PACKED_VERSION}.zip\` |
          | **Linux** | ARM64 | \`pnut-term-ts-linux-arm64-${PACKED_VERSION}.zip\` |

          ---

          ### Installing

          **macOS**: Download the ZIP, extract the DMG, and drag the app to Applications.

          **Windows/Linux**: Download the ZIP, extract to your preferred location, and run the executable.

          ---

          ### Checksums

          See \`checksums.txt\` for SHA256 checksums of all files.
          RELEASE_EOF

          echo "Generated release body:"
          cat release_body.md

      - name: Create Release
        # Pinned to an exact version deliberately — a floating major tag is how an
        # unchanged repo starts failing overnight.
        #
        # History: v1 routinely hung for ~hours on asset upload. v2 (last: v2.6.2) is a
        # Node 20 action, and once GitHub flipped the runner default to Node 24 the
        # v0.10.0 publish failed AFTER uploading every asset — an HttpError: Not Found on
        # an asset that demonstrably existed, then "Error updating policy" — leaving the
        # release stuck as a draft. v3.0.0 is the Node 24 runtime migration; v3.0.2 adds
        # draft-release-reuse reliability and better error diagnostics, which is exactly
        # the step that failed.
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.release_type.outputs.RELEASE_TAG }}
          name: ${{ steps.release_type.outputs.RELEASE_NAME }}
          draft: false
          prerelease: ${{ steps.release_type.outputs.IS_PRERELEASE == 'true' }}
          files: |
            release/*
          body_path: release_body.md
          fail_on_unmatched_files: true
