name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit is pushed to the same ref, so
# rapid successive pushes don't pile up redundant runs. Keyed per workflow+ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Run JS actions on Node 24 now (becomes the runner default 2026-06-16),
  # clearing the Node 20 deprecation warnings — incl. actions/cache, which has
  # no Node 24 major yet. See github.blog deprecation-of-node-20 changelog.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          # Electron's postinstall download can hit transient CDN errors — retry.
          for attempt in 1 2 3; do
            echo "npm ci (attempt ${attempt}/3)"
            if npm ci; then exit 0; fi
            echo "npm ci failed — retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Run ESLint
        run: npm run lint --if-present  # no-op until a "lint" script is configured (no red X)
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          # Electron's postinstall download can hit transient CDN errors — retry.
          for attempt in 1 2 3; do
            echo "npm ci (attempt ${attempt}/3)"
            if npm ci; then exit 0; fi
            echo "npm ci failed — retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Test-coverage & no-skip gate
        run: |
          # Fail the build if any tests/*.test.ts is neither registered in
          # run_tests_sequentially.sh nor in EXCLUDED_TESTS (with a reason), or if
          # any non-excluded test carries a .skip/.only marker. A test the runner
          # never invokes — or one silently skipped — is an invisible failure;
          # this gate makes that drift red instead of hidden. [sprint 0.9.47 §7]
          chmod +x scripts/claude/check_test_coverage.sh
          scripts/claude/check_test_coverage.sh

      - name: Build
        run: npm run build

      - name: Run tests
        run: |
          # Bounded-parallel runner over the SAME curated set as the sequential
          # script (which stays the source of truth for which tests are green;
          # some legacy tests reference deprecated modules and remain excluded).
          # GitHub runners have spare cores, so use 50% workers for fast feedback;
          # workerIdleMemoryLimit keeps memory-heavy suites deterministic.
          # (run_tests_parallel.sh re-runs the gate too — belt and suspenders.)
          chmod +x scripts/claude/run_tests_parallel.sh
          JEST_WORKERS=50% scripts/claude/run_tests_parallel.sh

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          # Electron's postinstall download can hit transient CDN errors — retry.
          for attempt in 1 2 3; do
            echo "npm ci (attempt ${attempt}/3)"
            if npm ci; then exit 0; fi
            echo "npm ci failed — retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Build TypeScript
        run: npm run build

      - name: Verify production build
        run: npm run build:production
